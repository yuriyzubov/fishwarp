[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishwarp-ants-registration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "antspyx>=0.5",
    "click>=8",
    "dask>=2024",
    "edt>=2",
    "matplotlib>=3.7",
    "neuroglancer>=2.40",
    "numcodecs>=0.12",
    "numpy>=1.26",
    "zarr>=3",
]

# The registration stages are scripts, not an importable package: each stage
# does `import config` / `from utils import …`, which only works when run from
# inside ants/registration. This pyproject.toml therefore declares no packages
# — `pip install .` installs the dependency set, nothing more.
[tool.setuptools]
packages = []
